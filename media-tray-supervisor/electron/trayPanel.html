<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShelfDeck 小助手</title>
    <style>
      body {
        font-family: 'Segoe UI', sans-serif;
        margin: 0;
        padding: 12px 14px;
        background: #0f172a;
        color: #e5e7eb;
        font-size: 13px;
        line-height: 1.45;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      .addr {
        font-weight: 700;
        word-break: break-all;
        font-size: 14px;
        color: #fff;
      }
      .row {
        margin: 8px 0;
      }
      .muted {
        color: #94a3b8;
        font-size: 12px;
      }
      .statusLine {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot-yellow {
        background: #ca8a04;
      }
      .dot-green {
        background: #22c55e;
      }
      .dot-red {
        background: #ef4444;
      }
      button {
        background: #1d4ed8;
        color: #fff;
        border: 1px solid #2563eb;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 13px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.secondary {
        background: #1f2937;
        border-color: #374151;
      }
      .btnRow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .card {
        border: 1px solid #1f2937;
        border-radius: 10px;
        padding: 10px;
        margin-top: 10px;
        background: #111827;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #374151;
        background: #020617;
        color: #e5e7eb;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: #cbd5e1;
      }
      .hint {
        margin-top: 6px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <h1>ShelfDeck 小助手</h1>
    <div class="row statusLine">
      <span id="dot" class="dot dot-yellow" aria-hidden="true"></span>
      <span id="statusText">加载中…</span>
    </div>
    <div class="row">
      <div class="muted">当前媒体管理服务地址</div>
      <div id="addr" class="addr">—</div>
    </div>
    <div class="row muted" id="keyLine">API Key：—</div>
    <div class="btnRow">
      <button type="button" id="btnConn">更改连接</button>
      <button type="button" class="secondary" id="btnDesktop">打开 ShelfDeck 主界面</button>
    </div>

    <div class="card">
      <div class="muted">任务队列摘要</div>
      <div id="queue" style="margin-top: 6px">—</div>
    </div>

    <div class="btnRow">
      <button type="button" id="btnStart">启动媒体管理服务</button>
      <button type="button" class="secondary" id="btnStop">停止</button>
      <button type="button" class="secondary" id="btnRestart">重启</button>
    </div>
    <div id="ctlHint" class="hint"></div>

    <div class="card" id="connForm" style="display: none">
      <label for="inUrl">服务器基址（无尾部斜杠）</label>
      <input id="inUrl" placeholder="http://127.0.0.1:18080" autocomplete="off" />
      <label for="inKey" style="margin-top: 8px">API Key（可选）</label>
      <input id="inKey" type="password" placeholder="可选" autocomplete="off" />
      <div class="btnRow">
        <button type="button" id="btnSaveConn">保存并校验</button>
        <button type="button" class="secondary" id="btnCancelConn">取消</button>
      </div>
      <div id="saveMsg" class="hint"></div>
    </div>

    <div class="card">
      <label><input type="checkbox" id="chkAutostart" /> 开机自动启动 ShelfDeck 小助手</label>
      <label style="margin-top: 8px; display: block"
        ><input type="checkbox" id="chkQuitKill" /> 退出小助手时同时停止本机媒体管理服务</label
      >
      <div class="hint">停止远程 NAS 上的服务时，若无法自动停止，将提示您在服务器侧操作。</div>
    </div>

    <script src="trayPanel.js"></script>
  </body>
</html>
