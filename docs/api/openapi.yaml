openapi: 3.0.3
info:
  title: ShelfDeck — Media Service API
  description: |
    媒体管理服务 HTTP API（目标态）。与 Electron 客户端、未来 MCP 工具共用领域服务。
    任务行为以 `docs/design/DESIGN_TASK_CENTER.md` 为 SSOT；战略与 MCP 见 `docs/architecture/ARCH_SYSTEM_OVERVIEW.md`。
  version: 0.1.0

servers:
  - url: https://localhost:8443
    description: 本地开发（TLS 占位）
  - url: http://127.0.0.1:18080
    description: 本地开发（明文占位）

tags:
  - name: Health
    description: 存活与版本
  - name: Config
    description: 媒体管理服务配置（服务端点、策略缓存键等）
  - name: Library
    description: 片库查询与 Emby 写回（与现 `emby:*` IPC 对齐）
  - name: Revisit
    description: 经典回顾队列（媒体管理服务 P0）
  - name: Tasks
    description: 治理任务入队与查询（目标态持久化；对齐任务中心 SSOT）
  - name: Transcode
    description: 转码工单与工具链（与现 `transcode:*` IPC 对齐）
  - name: Integrations
    description: 第三方集成（豆瓣等）

security:
  - ApiKeyAuth: []
  - BearerAuth: []

paths:
  /v1/health:
    get:
      tags: [Health]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /v1/config:
    get:
      tags: [Config]
      summary: 获取媒体管理服务配置
      responses:
        '200':
          description: 当前配置快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlPlaneConfig'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Config]
      summary: 部分更新配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlPlaneConfigPatch'
      responses:
        '200':
          description: 更新后的配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlPlaneConfig'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/sync/task-queue:
    get:
      tags: [Tasks]
      summary: 任务中心队列快照（桌面与渲染进程 SSOT）
      description: |
        与任务中心 `MediaTask[]` 序列化一致；桌面 dev/prod 默认经此前缀同步，替代浏览器 `localStorage` 真相。
      responses:
        '200':
          description: 任务数组
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags: [Tasks]
      summary: 覆盖写入任务队列快照
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: true
      responses:
        '200':
          description: 已持久化
          content:
            application/json:
              schema:
                type: object
                required: [ok, count]
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/actions/get-item:
    post:
      tags: [Library]
      summary: 单条片目详情（紧凑载荷，与现 preload 一致）
      description: Body 含完整 `{ config, itemId }`；不依赖媒体管理服务已缓存的 `embyClient`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Emby Item DTO
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/actions/delete-info:
    post:
      tags: [Library]
      summary: 删除预检（紧凑载荷）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 预检结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/actions/exists:
    post:
      tags: [Library]
      summary: 片目是否仍存在（紧凑载荷）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 存在性
          content:
            application/json:
              schema:
                type: object
                required: [exists]
                properties:
                  exists:
                    type: boolean
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/actions/delete-item:
    post:
      tags: [Library]
      summary: 删除片目（紧凑载荷）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: 已删除
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/actions/mark-played:
    post:
      tags: [Library]
      summary: 标记已播放（紧凑载荷）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: 已更新
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/actions/mark-unplayed:
    post:
      tags: [Library]
      summary: 标记未播放（紧凑载荷）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: 已更新
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/emby/actions/test-connection:
    post:
      tags: [Library]
      summary: 探测 Emby 连接（对等于 emby:testConnection）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbyConnectionRequest'
      responses:
        '200':
          description: 探测结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbyConnectionResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/emby/actions/list-users:
    post:
      tags: [Library]
      summary: 列出 Emby 用户（emby:getUsers）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbyConnectionRequest'
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/emby/actions/list-media-folders:
    post:
      tags: [Library]
      summary: 列出媒体库文件夹（emby:getMediaFolders）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbyConnectionRequest'
      responses:
        '200':
          description: 媒体库列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/queries/unplayed:
    post:
      tags: [Library]
      summary: 未播放列表（emby:getUnplayedItems）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryQueryRequest'
      responses:
        '200':
          description: 条目列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/queries/manage:
    post:
      tags: [Library]
      summary: 媒体库治理列表（emby:getLibraryItemsForManage）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryQueryRequest'
      responses:
        '200':
          description: 条目列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/queries/played:
    post:
      tags: [Library]
      summary: 已播放列表（emby:getPlayedItems）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryQueryRequest'
      responses:
        '200':
          description: 条目列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/items/{itemId}:
    get:
      tags: [Library]
      summary: 单条片目详情（emby:getLibraryItem）
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/EmbyContextQuery'
      responses:
        '200':
          description: Emby Item DTO
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Library]
      summary: 删除片目（emby:deleteLibraryItem）
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/EmbyContextQuery'
      responses:
        '204':
          description: 已删除
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/items/{itemId}/delete-info:
    get:
      tags: [Library]
      summary: 删除预检（emby:getItemDeleteInfo）
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/EmbyContextQuery'
      responses:
        '200':
          description: 预检结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/items/{itemId}/exists:
    get:
      tags: [Library]
      summary: 片目是否仍存在（emby:libraryItemExists）
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/EmbyContextQuery'
      responses:
        '200':
          description: 存在性
          content:
            application/json:
              schema:
                type: object
                required: [exists]
                properties:
                  exists:
                    type: boolean
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/items/{itemId}/played:
    post:
      tags: [Library]
      summary: 标记已播放（emby:markPlayed）
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/EmbyContextQuery'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: 已更新
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Library]
      summary: 标记未播放（emby:markUnplayed）
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/EmbyContextQuery'
      responses:
        '204':
          description: 已更新
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/client/actions/launch-player:
    post:
      tags: [Library]
      summary: 启动本机第三方播放器（可选；首选仍由 Electron IPC 处理）
      description: |
        若媒体管理服务不部署在与用户会话同一桌面环境，此端点可不实现；客户端本地 `emby:launchPlayer` 保留。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: 已触发启动
        '501':
          description: 服务端不支持本地起进程
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/transcode/actions/abort-all:
    post:
      tags: [Transcode]
      summary: 中止所有编码任务（对等于 taskControl.simulateExit）
      responses:
        '204':
          description: 已请求中止
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/revisit/entries:
    get:
      tags: [Revisit]
      summary: 重温队列列表
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 条目列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevisitEntry'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Revisit]
      summary: 加入重温队列（幂等策略由实现与产品约定）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisitEntryCreate'
      responses:
        '201':
          description: 已创建或已存在并更新元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisitEntry'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/revisit/entries/{entryId}:
    delete:
      tags: [Revisit]
      summary: 从重温队列移除
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 已删除
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/tasks:
    get:
      tags: [Tasks]
      summary: 列出治理任务
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GovernanceTask'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Tasks]
      summary: 入队治理任务（意图式，服务端补全详情并校验）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceTaskCreate'
      responses:
        '201':
          description: 任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceTask'
        '400':
          description: 校验失败（缺字段、无效 actionType 或 Emby 未配置）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 蓝光原盘拒绝或同 ID 互斥
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: 查询单条任务
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceTask'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Tasks]
      summary: 更新任务状态或字段
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: 新状态（如 paused、executing 等）
                progress:
                  type: number
                  description: 进度百分比
              additionalProperties: true
      responses:
        '200':
          description: 更新后的任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceTask'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Tasks]
      summary: 从任务中心移除任务
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: 已移除
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/tasks/{taskId}/actions/execute:
    post:
      tags: [Tasks]
      summary: 执行任务（手动模式下触发）
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 已触发执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceTask'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/tasks/{taskId}/actions/pause:
    post:
      tags: [Tasks]
      summary: 暂停任务
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 已暂停
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceTask'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/library/ratings:
    get:
      tags: [Library]
      summary: 获取全部用户标注星级映射
      responses:
        '200':
          description: "{ itemId: { rating, updatedAt } }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    rating:
                      type: integer
                      minimum: 1
                      maximum: 5
                    updatedAt:
                      type: string
                      format: date-time
    patch:
      tags: [Library]
      summary: 批量更新用户标注星级
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
                description: 星级对象，rating 1-5，或 null 表示删除该条目
                properties:
                  rating:
                    type: integer
                    minimum: 1
                    maximum: 5
                  updatedAt:
                    type: string
                    format: date-time
      responses:
        '200':
          description: 更新结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer

  /v1/library/cache:
    get:
      tags: [Library]
      summary: 获取缓存的媒体库列表
      responses:
        '200':
          description: 缓存的媒体库列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  cachedAt:
                    type: string
                    format: date-time
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Library]
      summary: 刷新媒体库缓存
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 刷新完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  cachedAt:
                    type: string
                    format: date-time
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/integrations/douban/ratings/cache:
    get:
      tags: [Integrations]
      summary: 获取缓存的豆瓣评分
      responses:
        '200':
          description: 缓存的豆瓣评分列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  syncedAt:
                    type: string
                    format: date-time
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/integrations/douban/session:
    put:
      tags: [Integrations]
      summary: 保存豆瓣会话（douban:saveSession）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/ErrorResponse'
    get:
      tags: [Integrations]
      summary: 读取豆瓣会话（douban:getSession）
      responses:
        '200':
          description: 会话数据
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/integrations/douban/fetch/stop:
    post:
      tags: [Integrations]
      summary: 停止拉取评分（douban:stopFetch）
      responses:
        '204':
          description: 已请求停止
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/integrations/douban/fetch/ratings:
    post:
      tags: [Integrations]
      summary: 拉取评分（douban:fetchRatings）；返回工单 ID 供轮询
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: 异步作业已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubanFetchJob'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/integrations/douban/fetch/jobs/{jobId}:
    get:
      tags: [Integrations]
      summary: 豆瓣拉取作业状态（对等于 fetchProgress 事件聚合）
      parameters:
        - $ref: '#/components/parameters/TranscodeJobId'
      responses:
        '200':
          description: 作业状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubanFetchJob'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/transcode/actions/validate-tools:
    post:
      tags: [Transcode]
      summary: transcode:validateTools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscodeToolsRequest'
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/transcode/actions/probe-encode-devices:
    post:
      tags: [Transcode]
      summary: transcode:probeEncodeDevices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/transcode/actions/precheck:
    post:
      tags: [Transcode]
      summary: transcode:precheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 预检结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/transcode/jobs:
    post:
      tags: [Transcode]
      summary: 创建转码作业（transcode:startEncode）
      description: |
        接受后返回 `202` 与 `jobId`。进度与日志通过 `GET /v1/transcode/jobs/{jobId}` 轮询获取（对等于 IPC `transcode:progress`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: 作业已接受
          headers:
            Location:
              schema:
                type: string
              description: /v1/transcode/jobs/{jobId}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeJob'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/transcode/jobs/{jobId}:
    get:
      tags: [Transcode]
      summary: 查询转码作业状态与进度
      parameters:
        - $ref: '#/components/parameters/TranscodeJobId'
      responses:
        '200':
          description: 作业状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeJob'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/transcode/jobs/{jobId}/actions/abort:
    post:
      tags: [Transcode]
      summary: 中止作业（transcode:abort）
      parameters:
        - $ref: '#/components/parameters/TranscodeJobId'
      responses:
        '200':
          description: 中止结果
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/transcode/actions/probe:
    post:
      tags: [Transcode]
      summary: transcode:probe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 探测摘要
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/transcode/actions/replace:
    post:
      tags: [Transcode]
      summary: transcode:replace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 替换结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/transcode/actions/cleanup-workdir:
    post:
      tags: [Transcode]
      summary: transcode:cleanupTaskWorkdir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tempDir:
                  type: string
              additionalProperties: true
      responses:
        '200':
          description: 清理完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        default:
