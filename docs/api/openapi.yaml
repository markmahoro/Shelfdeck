  /v1/transcode/actions/scan-orphans:
    post:
      tags: [Transcode]
      summary: transcode:scanOrphans
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 扫描结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/transcode/actions/stat-paths:
    post:
      tags: [Transcode]
