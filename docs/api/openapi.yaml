components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 媒体管理服务 API Key（与 `docs/architecture/ARCH_SYSTEM_OVERVIEW.md` §2 一致）
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 可选用户令牌；与 API Key 二选一或并存策略由实现定义

  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
      description: Emby ItemId
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    TranscodeJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    EmbyContextQuery:
      name: embyProfileId
      in: query
      required: false
      schema:
        type: string
      description: 选用已保存的 Emby 连接配置；若省略则需在 body 其它端点携带完整连接信息（实现可约束）

  responses:
    ErrorResponse:
      description: 错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 稳定错误码（如 VALIDATION_ERROR、NOT_FOUND）
        message:
          type: string
        details:
          description: 可选结构化细节
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          description: 媒体管理服务构建版本

    ControlPlaneConfig:
      type: object
      additionalProperties: true
      description: |
        实现定义。桌面端会 PATCH 写入 `embyClient`（与 `EmbyConnectionRequest` 对齐的快照），供 `GET /v1/library/items/{itemId}` 等 **无需重复 body** 的调用；路径映射 `pathMapFrom` / `pathMapTo`、`transcodeTempRoot` 等可与 `embyClient` 并列顶层字段。
        Phase 1 新增字段：
        - `mediaPolicy`：码率策略（target1080p/target4k 梯度表），SSOT 在 service 端
        - `serviceApiKey`：Service 自身 API Key（持久化形态，与 env var 等效）

    ControlPlaneConfigPatch:
      type: object
      additionalProperties: true

    EmbyConnectionRequest:
      type: object
      additionalProperties: true
      description: 与现 `embyService` 调用载荷对齐（baseUrl、apiKey、userId 等）

    EmbyConnectionResult:
      type: object
      additionalProperties: true

    LibraryQueryRequest:
      type: object
      additionalProperties: true
      description: 与现 IPC 查询参数对齐

    RevisitEntry:
      type: object
      required: [id, userId, embyItemId, addedAt, source]
      properties:
        id:
          type: string
          description: 媒体管理服务条目 id（可与复合键不同）
        userId:
          type: string
        embyItemId:
          type: string
        addedAt:
          type: string
          format: date-time
        source:
          type: string
          example: openclaw:wechat
        note:
          type: string

    RevisitEntryCreate:
      type: object
      required: [embyItemId]
      properties:
        userId:
          type: string
        embyItemId:
          type: string
        source:
          type: string
        note:
          type: string

    GovernanceTask:
      type: object
      required: [id, kind, status]
      properties:
        id:
          type: string
        kind:
          type: string
          description: delete | transcode | wash 等（以任务中心为准）
        status:
          type: string
        payload:
          type: object
          additionalProperties: true
        flowLog:
          type: array
          items:
            type: object
            additionalProperties: true

    GovernanceTaskCreate:
      type: object
      description: |
        Phase 1 支持两种请求体：
        **意图式（推荐）**：只传 `{ itemId, actionType, runMode }`，服务端查 Emby item 补全 itemName 并做蓝光/互斥校验。
        **兼容旧格式**：传含 `id` 字段的完整任务对象（Phase 2 移除）。
      oneOf:
        - type: object
          required: [itemId, actionType]
          properties:
            itemId:
              type: string
              description: Emby 媒体 ID
            actionType:
              type: string
              enum: [delete, transcode, upgrade]
              description: 操作类型
            runMode:
              type: string
              enum: [manual, scheduled]
              description: 执行模式，默认取 service executionMode
        - type: object
          description: 旧格式（含预生成 id 的完整任务对象；Phase 2 移除）
          additionalProperties: true

    TranscodeJob:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string
          description: queued | running | succeeded | failed | aborted
        progress:
          type: object
          additionalProperties: true
          description: 对等于 IPC progress payload 聚合
        error:
          $ref: '#/components/schemas/ApiError'

    DoubanFetchJob:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string
        progress:
          type: object
          additionalProperties: true

    TranscodeToolsRequest:
      type: object
      required: [config, encodePool]
      properties:
        config:
          type: object
          additionalProperties: true
        encodePool:
          type: object
          additionalProperties: true
