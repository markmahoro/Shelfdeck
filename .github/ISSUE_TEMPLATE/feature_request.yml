name: 功能建议
description: 提出一个新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      placeholder: 你希望 ShelfDeck 支持什么功能？解决什么问题？
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: 使用场景
      placeholder: 描述一个典型的使用场景
    validations:
      required: false
