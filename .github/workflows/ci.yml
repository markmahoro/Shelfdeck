name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── Job 1: service Windows ────────────────────────────────────────────────
  service-windows:
    name: service (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: media-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: node scripts/package-win.js

  # ── Job 2: service Docker ─────────────────────────────────────────────────
  service-docker:
    name: service (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f media-service/Dockerfile -t shelfdeck:ci .
      - name: Smoke test — health check
        run: |
          docker run -d --name shelfdeck-ci -p 18080:18080 shelfdeck:ci
          sleep 8
          curl -fsS http://127.0.0.1:18080/v1/health
          curl -fsS http://127.0.0.1:18080/v1/admin/health
      - name: Show logs on failure
        if: failure()
        run: docker logs shelfdeck-ci
      - name: Cleanup
        if: always()
        run: docker rm -f shelfdeck-ci

  # ── Job 3: Tier 3 E2E smoke (CI-safe flows — no external deps) ───────────
  e2e-smoke:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    needs: service-docker
    steps:
      - uses: actions/checkout@v4
      - name: Build and start service
        run: |
          docker build -f media-service/Dockerfile -t shelfdeck:ci .
          docker run -d --name shelfdeck-e2e -p 18080:18080 shelfdeck:ci
          sleep 8
      - name: Run CI-safe flow tests
        run: |
          chmod +x tests/flows/*.sh tests/runner.sh
          SERVICE_URL=http://127.0.0.1:18080 bash tests/runner.sh health-check,config-roundtrip,task-crud tests/env/ci.env
      - name: Cleanup
        if: always()
        run: docker rm -f shelfdeck-e2e

  # ── Job 4: desktop Windows ────────────────────────────────────────────────
  desktop-windows:
    name: desktop (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: media-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - run: npm test
