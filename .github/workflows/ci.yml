name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supported CI surface is Linux/Docker only.
# Windows desktop and Windows service packaging are retired (not supported).

jobs:
  # ── Job 1: service Docker ─────────────────────────────────────────────────
  # Clean Helix refuses empty /app/data (CLEAN_DATABASE_MISSING). Smoke must
  # run helix-clean-init with a disposable secret before starting the server.
  service-docker:
    name: service (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f media-service/Dockerfile -t shelfdeck:ci .
      - name: Smoke test — health check
        run: |
          set -euo pipefail
          SECRET_ROOT="$(openssl rand -hex 32)"
          DATA_HOST="${RUNNER_TEMP}/shelfdeck-ci-data"
          mkdir -p "$DATA_HOST"
          docker run --rm \
            -e "SHELFDECK_SECRET_ROOT=${SECRET_ROOT}" \
            -v "${DATA_HOST}:/app/data" \
            shelfdeck:ci \
            node scripts/helix-clean-init.js --data-dir /app/data --apply --confirm INITIALIZE_HELIX_CLEAN_V1
          docker run -d --name shelfdeck-ci \
            -e "SHELFDECK_SECRET_ROOT=${SECRET_ROOT}" \
            -e MEDIA_SERVICE_DATA_DIR=/app/data \
            -v "${DATA_HOST}:/app/data" \
            -p 18080:18080 \
            shelfdeck:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/v1/health; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          # Helix clean surface: public health only (no legacy /v1/admin/health).
          curl -fsS http://127.0.0.1:18080/v1/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
      - name: Show logs on failure
        if: failure()
        run: docker logs shelfdeck-ci || true
      - name: Cleanup
        if: always()
        run: docker rm -f shelfdeck-ci || true

  # ── Job 2: Tier 3 E2E smoke (CI-safe — no external deps) ─────────────────
  # health-check only; config-roundtrip/task-crud are pre-Helix flows
  # (see docs/v2/TEST_ARCHITECTURE.md) and are not clean-runtime acceptance.
  e2e-smoke:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    needs: service-docker
    steps:
      - uses: actions/checkout@v4
      - name: Build and start service
        run: |
          set -euo pipefail
          SECRET_ROOT="$(openssl rand -hex 32)"
          DATA_HOST="${RUNNER_TEMP}/shelfdeck-e2e-data"
          mkdir -p "$DATA_HOST"
          docker build -f media-service/Dockerfile -t shelfdeck:ci .
          docker run --rm \
            -e "SHELFDECK_SECRET_ROOT=${SECRET_ROOT}" \
            -v "${DATA_HOST}:/app/data" \
            shelfdeck:ci \
            node scripts/helix-clean-init.js --data-dir /app/data --apply --confirm INITIALIZE_HELIX_CLEAN_V1
          docker run -d --name shelfdeck-e2e \
            -e "SHELFDECK_SECRET_ROOT=${SECRET_ROOT}" \
            -e MEDIA_SERVICE_DATA_DIR=/app/data \
            -v "${DATA_HOST}:/app/data" \
            -p 18080:18080 \
            shelfdeck:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/v1/health; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
      - name: Run CI-safe flow tests
        run: |
          chmod +x tests/flows/*.sh tests/runner.sh
          SERVICE_URL=http://127.0.0.1:18080 bash tests/runner.sh health-check tests/env/ci.env
      - name: Cleanup
        if: always()
        run: docker rm -f shelfdeck-e2e || true
